<title>Del dato a la decisión</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: escenario fijo 1920x1080 escalado al visor; barra de control debajo. Diseño oscuro deliberado (una sola apariencia). */
:root {
  --bg: #050B1F;
  --deep: #0A1533;
  --card: #0C1A3D;
  --line: #2A3F78;
  --ink: #EAF0FF;
  --muted: #8FA3D6;
  --yellow: #FFE600;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
.app {
  height: 100%; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.viewport { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
.frame { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); background: var(--bg); }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
.stage canvas, .stage svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }

/* Textos de escena */
.caption { position: absolute; left: 120px; top: 92px; width: 1240px; }
.caption .eyebrow { font: 500 20px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--yellow); margin-bottom: 22px; }
.caption .headline { font: 600 66px/1.08 var(--font-display); letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.caption .headline .row { display: block; }
.caption .headline .hl { color: var(--yellow); }
.caption .sub { font: 500 25px/1.35 var(--font-body); color: var(--muted); margin-top: 18px; }
.word { display: inline-block; margin-right: .26em; will-change: transform, opacity, filter; }

.hud { position: absolute; right: 120px; top: 98px; font: 500 15px/1 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.hud b { color: var(--yellow); font-weight: 500; }

.tracker { position: absolute; left: 120px; right: 120px; top: 1000px; height: 40px; }
.tracker .rail, .tracker .fill { position: absolute; left: 0; top: 0; height: 2px; }
.tracker .rail { right: 0; background: var(--line); }
.tracker .fill { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
.tracker .stop { position: absolute; top: -4px; transform: translateX(-1px); }
.tracker .stop i { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--deep); box-shadow: inset 0 0 0 2px var(--line); }
.tracker .stop span { display: block; margin-top: 12px; font: 500 13px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tracker .stop.on i { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
.tracker .stop.on span { color: var(--ink); }

.closing { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.closing .inner { width: 1760px; }
.closing .eyebrow { font: 500 24px/1 var(--font-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--yellow); }
.closing .title { font: 600 80px/1.06 var(--font-display); letter-spacing: -0.03em; margin: 30px 0 0; white-space: nowrap; }
.closing .rule { height: 3px; width: 560px; margin: 34px auto 30px; background: var(--yellow); box-shadow: 0 0 18px var(--yellow); transform-origin: 50% 50%; }
.closing .sub { font: 500 32px/1.4 var(--font-body); color: var(--muted); margin: 0 auto; max-width: 44ch; text-wrap: balance; }
.closing .sub b { color: var(--ink); font-weight: 600; }

/* Controles */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.controls button {
  font: 500 13px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink); background: var(--deep); border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 16px; cursor: pointer;
}
.controls button.primary { background: var(--yellow); border-color: var(--yellow); color: var(--bg); }
.controls button:hover { border-color: var(--muted); }
.controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
.controls input[type=range] { flex: 1 1 220px; min-width: 0; accent-color: var(--yellow); }
.controls .clock { font-variant-numeric: tabular-nums; min-width: 15ch; text-align: right; }

body.render .app { padding: 0; gap: 0; }
body.render .controls { display: none; }
body.render .frame { border-radius: 0; box-shadow: none; }
</style>

<div class="app">
  <div class="viewport" id="viewport">
    <div class="frame" id="frame">
      <div class="stage" id="stage" aria-label="Animación: del dato a la decisión" role="img">
        <canvas id="bg" width="1920" height="1080"></canvas>
        <svg id="world" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="hud" id="hud">Del dato <b>→</b> a la decisión</div>
        <div class="caption" id="caption"></div>
        <div class="tracker" id="tracker"><div class="rail"></div><div class="fill" id="trackFill"></div></div>
        <div class="closing" id="closing">
          <div class="inner">
            <div class="eyebrow" id="cEyebrow">Gobierno de Datos</div>
            <h2 class="title" id="cTitle"></h2>
            <div class="rule" id="cRule"></div>
            <p class="sub" id="cSub">para convertir información en <b>valor</b> y preparar el futuro de la <b>IA</b>.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="play" class="primary" type="button">Pausar</button>
    <button id="restart" type="button">Reiniciar</button>
    <input id="scrub" type="range" min="0" max="20000" step="10" value="0" aria-label="Posición en la línea de tiempo">
    <span class="clock" id="clock">00.00 / 20.00 s</span>
  </div>
</div>

<script>
(() => {
  'use strict';
  const DUR = 20, W = 1920, H = 1080;
  const Y = '#FFE600', INK = '#EAF0FF', MUTED = '#8FA3D6', LINE = '#2A3F78', CARD = '#0C1A3D', PANEL = '#13254F', BAR = '#1D3366';
  const RENDER = !!window.__RENDER || /[?&]render\b/.test(location.search);
  if (RENDER) document.body.classList.add('render');

  /* ---------- utilidades ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const easeOut = k => 1 - Math.pow(1 - k, 3);
  const env = (t, a, b, fi = .35, fo = .35) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
  const NS = 'http://www.w3.org/2000/svg';
  function S(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function T(parent, x, y, text, o = {}) {
    const e = S('text', { x, y, fill: o.fill || INK, 'font-family': o.family || 'Sora, system-ui, sans-serif', 'font-size': o.size || 16, 'font-weight': o.weight || 500, 'text-anchor': o.anchor || 'middle', 'letter-spacing': o.ls || 0 }, parent);
    e.textContent = text; return e;
  }
  const MONO = 'JetBrains Mono, ui-monospace, monospace', BODY = 'Manrope, system-ui, sans-serif';

  /* ---------- SVG base ---------- */
  const svg = document.getElementById('world');
  const defs = S('defs', {}, svg);
  const blur = S('filter', { id: 'blur', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  S('feGaussianBlur', { stdDeviation: 6 }, blur);
  const cardGrad = S('linearGradient', { id: 'cardFill', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  S('stop', { offset: 0, 'stop-color': '#10214B' }, cardGrad); S('stop', { offset: 1, 'stop-color': '#0A1633' }, cardGrad);
  const areaGrad = S('linearGradient', { id: 'areaFill', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  S('stop', { offset: 0, 'stop-color': Y, 'stop-opacity': .35 }, areaGrad); S('stop', { offset: 1, 'stop-color': Y, 'stop-opacity': 0 }, areaGrad);

  const cam = S('g', {}, svg);
  const L = {};
  ['ai', 'gov', 'lines', 'nodes', 'details', 'lineage', 'heads'].forEach(n => L[n] = S('g', {}, cam));

  /* ---------- trazos animables ---------- */
  const strokes = [];
  function drawPath(parent, d, a, b, o = {}) {
    const g = S('g', {}, parent);
    const glow = S('path', { d, fill: 'none', stroke: o.color || Y, 'stroke-width': o.glowW || 10, 'stroke-linecap': 'round', opacity: .45, filter: 'url(#blur)' }, g);
    const core = S('path', { d, fill: 'none', stroke: o.color || Y, 'stroke-width': o.w || 3, 'stroke-linecap': 'round' }, g);
    const len = core.getTotalLength();
    [glow, core].forEach(p => p.setAttribute('stroke-dasharray', len + ' ' + len));
    const s = { g, glow, core, len, a, b, ease: o.ease || easeIO, head: o.head ? makeHead() : null, p: 0 };
    strokes.push(s); return s;
  }
  function makeHead() {
    const g = S('g', { opacity: 0 }, L.heads);
    S('circle', { r: 20, fill: Y, opacity: .55, filter: 'url(#blur)' }, g);
    S('circle', { r: 6.5, fill: '#FFF8B0' }, g);
    return g;
  }
  function updateStroke(s, t) {
    const p = s.ease(prog(t, s.a, s.b)); s.p = p;
    const off = s.len * (1 - p);
    s.core.setAttribute('stroke-dashoffset', off); s.glow.setAttribute('stroke-dashoffset', off);
    s.g.setAttribute('opacity', p > 0 ? 1 : 0);
    if (s.head) {
      const vis = p > 0 && p < 1 ? 1 : clamp(1 - (t - s.b) / .25) * (p >= 1 ? 1 : 0);
      s.head.setAttribute('opacity', vis);
      if (vis > 0) { const pt = s.core.getPointAtLength(s.len * p); s.head.setAttribute('transform', `translate(${pt.x} ${pt.y})`); }
    }
  }

  /* ---------- nodos de la arquitectura ---------- */
  const NY = 470;
  const NODES = [
    { id: 'sap', x: 230, title: 'SAP', sub: 'Sistema origen', glow: [0.8, 3.3] },
    { id: 'sql', x: 600, title: 'SQL', sub: 'Tablas de aterrizaje', glow: [3.5, 5.0] },
    { id: 'trf', x: 960, title: 'Transformaciones', sub: 'Reglas y validación', glow: [4.6, 6.0] },
    { id: 'dm', x: 1320, title: 'Data Marts', sub: 'Modelos de negocio', glow: [6.7, 9.0] },
    { id: 'pbi', x: 1700, title: 'Power BI', sub: 'Indicadores', glow: [9.3, 12.0] }
  ];
  const ARRIVE = [0.15, 3.5, 4.6, 6.7, 9.3];
  NODES.forEach((n, i) => {
    n.g = S('g', {}, L.nodes);
    n.halo = S('rect', { x: -100, y: -75, width: 200, height: 150, rx: 16, fill: 'none', stroke: Y, 'stroke-width': 14, opacity: 0, filter: 'url(#blur)' }, n.g);
    S('rect', { x: -100, y: -75, width: 200, height: 150, rx: 16, fill: 'url(#cardFill)', stroke: LINE, 'stroke-width': 1.5 }, n.g);
    n.ring = S('rect', { x: -100, y: -75, width: 200, height: 150, rx: 16, fill: 'none', stroke: Y, 'stroke-width': 2, opacity: 0 }, n.g);
    n.inner = S('g', {}, n.g);
    T(n.g, 0, 104, n.title, { size: 21, weight: 600 });
    T(n.g, 0, 127, n.sub.toUpperCase(), { size: 11.5, family: MONO, fill: MUTED, ls: 1.4 });
  });
  const N = Object.fromEntries(NODES.map(n => [n.id, n]));

  // SAP: registros del sistema transaccional
  const sapRows = [];
  S('rect', { x: -84, y: -60, width: 168, height: 18, rx: 5, fill: PANEL }, N.sap.inner);
  T(N.sap.inner, -76, -47, 'ERP · TRANSACCIONES', { size: 9.5, family: MONO, fill: MUTED, anchor: 'start', ls: 1 });
  [120, 92, 136, 104, 78].forEach((w, i) => {
    const y = -32 + i * 18;
    S('rect', { x: -84, y, width: w, height: 9, rx: 3, fill: BAR }, N.sap.inner);
    sapRows.push(S('rect', { x: -84, y, width: w, height: 9, rx: 3, fill: Y, opacity: 0 }, N.sap.inner));
  });
  const sapDot = S('g', { opacity: 0 }, L.heads);
  S('circle', { r: 16, fill: Y, opacity: .6, filter: 'url(#blur)' }, sapDot);
  S('circle', { r: 6, fill: '#FFF8B0' }, sapDot);
  const sapTag = S('g', { opacity: 0 }, L.details);
  T(sapTag, 415, 438, 'UN REGISTRO', { size: 11, family: MONO, fill: Y, ls: 1.6 });

  // SQL: base de datos
  (g => {
    S('path', { d: 'M-44 -36 v62 a44 13 0 0 0 88 0 v-62', fill: PANEL, stroke: '#3D5AA0', 'stroke-width': 1.5 }, g);
    S('ellipse', { cx: 0, cy: -36, rx: 44, ry: 13, fill: BAR, stroke: '#3D5AA0', 'stroke-width': 1.5 }, g);
    S('path', { d: 'M-44 -15 a44 13 0 0 0 88 0 M-44 6 a44 13 0 0 0 88 0', fill: 'none', stroke: '#3D5AA0', 'stroke-width': 1.2 }, g);
  })(N.sql.inner);
  N.sql.cap = S('ellipse', { cx: 0, cy: -36, rx: 44, ry: 13, fill: Y, opacity: 0 }, N.sql.inner);
  const tables = [515, 600, 685].map((cx, i) => {
    const g = S('g', { opacity: 0 }, L.details);
    S('rect', { x: cx - 35, y: 622, width: 70, height: 44, rx: 5, fill: CARD, stroke: LINE, 'stroke-width': 1.2 }, g);
    S('rect', { x: cx - 35, y: 622, width: 70, height: 10, rx: 5, fill: BAR }, g);
    S('path', { d: `M${cx - 35} 643 h70 M${cx - 35} 654 h70 M${cx - 12} 632 v34 M${cx + 12} 632 v34`, stroke: LINE, 'stroke-width': 1 }, g);
    T(g, cx, 684, 'LND_0' + (i + 1), { size: 10, family: MONO, fill: MUTED, ls: 1 });
    const drop = S('circle', { r: 4.5, fill: Y, opacity: 0 }, L.heads);
    return { g, cx, drop, t: 3.6 + i * 0.16 };
  });

  // Transformaciones: engranaje
  N.trf.gear = S('g', {}, N.trf.inner);
  (g => {
    let d = ''; const teeth = 10, ro = 38, ri = 29;
    for (let i = 0; i < teeth * 2; i++) {
      const r = i % 2 ? ri : ro, a0 = (i / (teeth * 2)) * Math.PI * 2, a1 = ((i + 1) / (teeth * 2)) * Math.PI * 2;
      d += (i ? 'L' : 'M') + (r * Math.cos(a0)).toFixed(1) + ' ' + (r * Math.sin(a0)).toFixed(1) + ' L' + (r * Math.cos(a1)).toFixed(1) + ' ' + (r * Math.sin(a1)).toFixed(1);
    }
    S('path', { d: d + 'Z', fill: PANEL, stroke: '#3D5AA0', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, g);
    S('circle', { r: 15, fill: CARD, stroke: '#3D5AA0', 'stroke-width': 1.5 }, g);
  })(N.trf.gear);
  N.trf.fx = T(N.trf.inner, 0, 5, 'f(x)', { size: 12, family: MONO, fill: MUTED });
  const trfChips = ['Limpiar', 'Unir', 'Validar ✓'].map((txt, i) => chip(L.details, 860 + i * 100, 642, 90, txt, 4.6 + [0, .25, .55][i]));

  // Data Marts: cubos por dominio
  N.dm.cubes = [-52, 0, 52].map(cx => {
    const g = S('g', {}, N.dm.inner), s = 22, cy = -2;
    S('polygon', { points: `${cx - s},${cy - s / 2} ${cx},${cy} ${cx},${cy + s} ${cx - s},${cy + s / 2}`, fill: '#172B5C', stroke: '#4A6BC0', 'stroke-width': .8 }, g);
    S('polygon', { points: `${cx + s},${cy - s / 2} ${cx},${cy} ${cx},${cy + s} ${cx + s},${cy + s / 2}`, fill: '#1F3A78', stroke: '#4A6BC0', 'stroke-width': .8 }, g);
    const top = S('polygon', { points: `${cx},${cy - s} ${cx + s},${cy - s / 2} ${cx},${cy} ${cx - s},${cy - s / 2}`, fill: '#2B4790', stroke: '#4A6BC0', 'stroke-width': .8 }, g);
    return { g, top };
  });
  const dmChips = ['Finanzas', 'Comercial', 'Operaciones'].map((txt, i) => chip(L.details, 1200 + i * 120, 642, 108, txt, 6.85 + i * .3));

  // Power BI: tablero genérico (sin cifras)
  (g => {
    N.pbi.kpi = S('rect', { x: -84, y: -58, width: 76, height: 54, rx: 8, fill: PANEL, stroke: LINE, 'stroke-width': 1.2 }, g);
    T(g, -76, -44, 'KPI', { size: 9.5, family: MONO, fill: MUTED, anchor: 'start', ls: 1.2 });
    S('rect', { x: -76, y: -34, width: 26, height: 6, rx: 3, fill: '#3D5AA0' }, g);
    S('rect', { x: -76, y: -22, width: 18, height: 6, rx: 3, fill: BAR }, g);
    S('circle', { cx: -29, cy: -26, r: 12, fill: 'none', stroke: BAR, 'stroke-width': 4 }, g);
    N.pbi.arc = S('circle', { cx: -29, cy: -26, r: 12, fill: 'none', stroke: Y, 'stroke-width': 4, 'stroke-dasharray': '75.4 75.4', 'stroke-dashoffset': 75.4, transform: 'rotate(-90 -29 -26)', 'stroke-linecap': 'round' }, g);
    N.pbi.bars = [22, 34, 28, 46, 38].map((h, i) => ({ h, el: S('rect', { x: 6 + i * 16, y: -4, width: 10, height: 0, rx: 2, fill: i === 3 ? Y : '#3D5AA0' }, g) }));
    const pts = []; for (let i = 0; i <= 12; i++) pts.push([-84 + i * 14, 40 - 10 * Math.sin(i * .7) - i * 1.2]);
    const line = 'M' + pts.map(p => p.join(' ')).join(' L');
    const clip = S('clipPath', { id: 'sparkClip' }, defs);
    N.pbi.clip = S('rect', { x: -86, y: 0, width: 0, height: 60 }, clip);
    const sg = S('g', { 'clip-path': 'url(#sparkClip)' }, g);
    S('path', { d: line + ` L84 56 L-84 56Z`, fill: 'url(#areaFill)' }, sg);
    S('path', { d: line, fill: 'none', stroke: Y, 'stroke-width': 2, 'stroke-linejoin': 'round' }, sg);
  })(N.pbi.inner);

  function chip(parent, cx, cy, w, text, t0) {
    const g = S('g', { opacity: 0 }, parent);
    const r = S('rect', { x: cx - w / 2, y: cy - 15, width: w, height: 30, rx: 15, fill: CARD, stroke: LINE, 'stroke-width': 1.2 }, g);
    T(g, cx, cy + 5, text, { size: 13, family: BODY, weight: 600 });
    return { g, r, t0, cy };
  }
  function showChip(c, t, out) {
    const k = easeOut(prog(t, c.t0, c.t0 + .4)) * (out == null ? 1 : out);
    c.g.setAttribute('opacity', k);
    c.g.setAttribute('transform', `translate(0 ${(1 - k) * 14})`);
    c.r.setAttribute('stroke', t > c.t0 && t < c.t0 + .9 ? Y : LINE);
  }

  /* ---------- hilo amarillo SAP → SQL → Transformaciones → Data Marts → Power BI ---------- */
  function wave(x1, x2, y, amp) { const xm = (x1 + x2) / 2; return `M${x1} ${y} C${x1 + 50} ${y} ${xm - 40} ${y + amp} ${xm} ${y + amp} S${x2 - 50} ${y} ${x2} ${y}`; }
  const SEG_T = [[1.5, 3.5], [4.0, 4.6], [5.6, 6.7], [8.2, 9.3]];
  const segs = SEG_T.map(([a, b], i) => drawPath(L.lines, wave(NODES[i].x + 100, NODES[i + 1].x - 100, NY, i % 2 ? 22 : -22), a, b, { head: true }));
  const flows = segs.map(s => [0, .5].map(() => S('circle', { r: 3.5, fill: '#FFF3A0', opacity: 0 }, L.lines)));

  /* ---------- linaje del KPI (de Power BI hacia el origen) ---------- */
  const TAG_Y = 350;
  const lineageTags = ['Origen', 'Aterrizaje', 'Regla', 'Modelo', 'KPI'].map((txt, i) => {
    const g = S('g', { opacity: 0 }, L.lineage), x = NODES[i].x, w = txt.length * 9 + 34;
    S('rect', { x: x - w / 2, y: TAG_Y - 15, width: w, height: 30, rx: 15, fill: '#1A1A08', stroke: Y, 'stroke-width': 1.3 }, g);
    T(g, x, TAG_Y + 5, txt.toUpperCase(), { size: 11.5, family: MONO, fill: Y, ls: 1.4 });
    S('path', { d: `M${x} ${TAG_Y + 15} V${NY - 75}`, stroke: Y, 'stroke-width': 1.2, 'stroke-dasharray': '3 4', opacity: .7 }, g);
    return g;
  });
  const LIN_T = [11.9, 11.55, 11.2, 10.85, 10.45];
  const lineageArcs = [3, 2, 1, 0].map(i => {
    const x1 = NODES[i + 1].x, x0 = NODES[i].x, id = 'lc' + i;
    const clip = S('clipPath', { id }, defs);
    const rect = S('rect', { x: x1, y: 200, width: 0, height: 200 }, clip);
    const g = S('g', { 'clip-path': `url(#${id})` }, L.lineage);
    S('path', { d: `M${x1} ${TAG_Y - 15} Q${(x0 + x1) / 2} ${TAG_Y - 85} ${x0} ${TAG_Y - 15}`, fill: 'none', stroke: Y, 'stroke-width': 2, 'stroke-dasharray': '7 7' }, g);
    return { rect, x0, x1, a: LIN_T[i + 1], b: LIN_T[i] };
  });

  /* ---------- capa transversal de Gobierno de Datos ---------- */

    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    if (e.key === 'r' || e.key === 'R') restartBtn.click();
  });

  window.__seek = show;
  window.__duration = DUR;

  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  fontsReady.then(() => {
    window.__ready = true;
    if (RENDER) { show(0); return; }
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { show(19.99); setPlaying(false); }
    else { show(0); setPlaying(true); }
  });
  show(0);
})();
</script>
